name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Every SQL-exercising suite gates itself on TEST_DATABASE_URL, so without
    # a server here the migration chain, the tenant foreign keys, the identity
    # upsert and the merge collision guard are all untested. Each suite builds
    # its own disposable database on this one and drops it again.
    services:
      postgres:
        image: postgres:16
        env:
          # A disposable CI database bound to localhost only; trust auth means
          # no password is ever written into this workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The disposable-database helper refuses a URL that does not carry this
      # capability, so a test run can never reach a real database by accident.
      SIQSHIFT_DISPOSABLE_TEST_CAPABILITY: ci-disposable-postgres
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?siqshift_disposable_test_capability=ci-disposable-postgres
    steps:
      - uses: actions/checkout@v4
      # Corepack ships with Node and installs the pnpm that the root
      # package.json pins, so this needs no download from codeload. Taking that
      # same pin from a third-party action instead put the download in `Set up
      # job`, ahead of every step, where a codeload outage failed the whole job
      # before checkout and no retry of ours could reach it. setup-node's pnpm
      # cache shells out to `pnpm store path`, so the shim comes first.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` ends with the layout suite, which drives a real Chromium: a
      # stylesheet rule and a shader uniform are claims about what a page looks
      # like, and jsdom has neither a layout engine nor WebGL to check one.
      # Chromium's system libraries come from the Ubuntu mirrors, so the
      # packages are cached and a warm run does not reach the mirrors. The key
      # names the runner image and the Playwright version, which fixes the
      # package list Playwright installs, so a change to either fetches anew.
      - id: chromium-deps-key
        run: echo "key=chromium-debs-$ImageOS-$ImageVersion-playwright-$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: chromium-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-debs/*.deb
          key: ${{ steps.chromium-deps-key.outputs.key }}
      - if: steps.chromium-deps-cache.outputs.cache-hit == 'true'
        run: sudo apt-get install --yes --no-download --no-install-recommends "$RUNNER_TEMP"/chromium-debs/*.deb
      - if: steps.chromium-deps-cache.outputs.cache-hit != 'true'
        run: |
          debs="$RUNNER_TEMP/chromium-debs"
          mkdir -p "$debs/partial"
          # apt keeps every package it downloads in that folder, for the cache.
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$debs" |
            sudo tee /etc/apt/apt.conf.d/99siqshift-chromium-debs > /dev/null
          for attempt in 1 2 3; do
            if pnpm exec playwright install-deps chromium; then
              sudo rm /etc/apt/apt.conf.d/99siqshift-chromium-debs
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error title=Ubuntu mirrors did not answer::Chromium's system libraries could not be downloaded from the Ubuntu mirrors in 3 tries, 60 seconds apart. Typecheck, tests and build did not run. Rerun this job once the mirrors answer."
          exit 1
      - if: steps.chromium-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/chromium-debs/*.deb
          key: ${{ steps.chromium-deps-key.outputs.key }}
      - run: pnpm exec playwright install chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Proves the deployable image still builds; the platform builds its own.
      - run: docker build -f apps/api/Dockerfile -t siqshift-api:ci .

  # Builds the store packages (Chrome/Edge zip and Firefox variant zip) and
  # keeps them as artifacts for the manual store submissions in DEPLOY.md.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siqshift/browser-extension build
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-store-zips
          path: apps/browser-extension/release/*.zip
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    env:
      TAURI_SYSTEM_PACKAGES: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The desktop build's system packages come from the Ubuntu mirrors, so
      # they are cached and a warm run does not reach the mirrors. The key
      # names the runner image and the package list, so a change to either
      # fetches anew.
      - id: tauri-deps-key
        run: echo "key=tauri-debs-$ImageOS-$ImageVersion-$(printf '%s' "$TAURI_SYSTEM_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: tauri-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/siqshift-tauri-deps/cache/archives/*.deb
          key: ${{ steps.tauri-deps-key.outputs.key }}
      - if: steps.tauri-deps-cache.outputs.cache-hit != 'true'
        run: |
          deps="$RUNNER_TEMP/siqshift-tauri-deps"
          mkdir -p "$deps/lists/partial" "$deps/cache/archives/partial"
          touch "$deps/status"
          apt_options=(
            -o "Dir::State::Lists=$deps/lists"
            -o "Dir::State::status=$deps/status"
            -o "Dir::Cache=$deps/cache"
            -o "Dir::Cache::Archives=$deps/cache/archives"
          )
          read -ra packages <<< "$TAURI_SYSTEM_PACKAGES"
          for attempt in 1 2 3; do
            if apt-get update "${apt_options[@]}" &&
              sudo apt-get --download-only --yes install "${apt_options[@]}" "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error title=Ubuntu mirrors did not answer::The desktop build's system packages could not be downloaded from the Ubuntu mirrors in 3 tries, 60 seconds apart. fmt, clippy and the desktop tests did not run. Rerun this job once the mirrors answer."
          exit 1
      - if: steps.tauri-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/siqshift-tauri-deps/cache/archives/*.deb
          key: ${{ steps.tauri-deps-key.outputs.key }}
      - run: |
          deps="$RUNNER_TEMP/siqshift-tauri-deps"
          mkdir -p "$deps/root"
          while IFS= read -r -d '' package; do
            dpkg-deb -x "$package" "$deps/root"
          done < <(find "$deps/cache/archives" -name '*.deb' -print0)
          echo "PKG_CONFIG_PATH=$deps/root/usr/lib/x86_64-linux-gnu/pkgconfig:$deps/root/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$deps/root" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "PATH=$deps/root/usr/bin:$PATH" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
