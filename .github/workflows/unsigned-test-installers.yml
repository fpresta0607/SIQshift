name: Unsigned test installers

# Builds the desktop test installers, uploads them as workflow-run artifacts,
# and (on a deliberate `workflow_dispatch` only) republishes the
# `unsigned-latest` release so the website has something anonymous visitors
# can actually download. Both builds are code signed by SIQstack LLC: the
# Windows one through Azure Artifact Signing, the macOS one with its Developer
# ID certificate and notarized by Apple. The macOS one is built only once the
# release environment holds the Apple signing secrets; until then a run
# builds and publishes nothing for the Mac. The tag keeps its old name because
# every installed copy's updater polls it.
#
# Why a release and not the run artifact: GitHub requires authentication to
# download a workflow artifact, so a raw artifact URL is useless to a signed-out
# visitor. Release assets are public on a public repo. The tag is fixed and the
# asset names are fixed, so `releases/download/unsigned-latest/<asset>` is a
# permanent URL that always serves the newest run's output. The web dashboard
# hard-codes exactly that URL; see `apps/web/src/DownloadInstaller.tsx`.
#
# This is deliberately NOT a relaxation of `release.yml`. That workflow still
# refuses to publish anything unsigned, and nothing here touches it. The two
# paths differ in what they build:
#
#   release.yml            cargo/tauri *release* build. `build.rs` treats a
#                          release build as a production artifact and demands
#                          the updater key plus platform signing credentials.
#   this workflow          tauri *debug* build (`tauri build --debug`), which
#                          `build.rs` already classifies as a development
#                          build, so `bundle.createUpdaterArtifacts` must stay
#                          off. Authenticode signing happens in the bundler,
#                          after compilation, and `build.rs` never sees it.
#
# So the production signing gate is honoured rather than bypassed.

on:
  # Once this file is on the default branch: Actions -> Unsigned test
  # installers -> Run workflow, from `main`. Every job that reads signing
  # secrets runs only from `main` or `unsigned-test/*`, so a run from any
  # other branch fails at its first job.
  workflow_dispatch:
  # workflow_dispatch only exists for workflows already on the default branch,
  # so this prefix is how you exercise the workflow from a branch before it
  # merges: push to `unsigned-test/anything`.
  push:
    branches: ["unsigned-test/**"]

# Read-only by default, so the build job cannot publish anything even by
# mistake. Only the small `publish` job below widens this, and it builds
# nothing.
permissions:
  contents: read

concurrency:
  group: unsigned-test-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which installers this run builds. Windows always: it signs through Azure.
  # The Mac only once the release environment holds every Apple signing
  # secret, because a Mac installer is published signed and notarized or not
  # at all. Partly configured Apple signing stops the run, since a half-built
  # setup that quietly dropped the Mac would hide itself. Only whether each
  # secret is set is read here, never its value.
  legs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - id: legs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          # NSIS only: WiX's light.exe fails to bundle the unoptimized debug
          # binary into an MSI. The NSIS setup .exe is the installer to run.
          windows='{"os":"windows-latest","target":"windows","bundle_args":"--bundles nsis","rust_targets":"","cargo_targets":"","tauri_target":"","bundle_dir":"apps/desktop/src-tauri/target/debug/bundle"}'
          # One universal app and .dmg for Apple silicon and Intel: each
          # architecture is compiled on its own and lipo joins them.
          macos='{"os":"macos-latest","target":"macos","bundle_args":"","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","cargo_targets":"--target aarch64-apple-darwin --target x86_64-apple-darwin","tauri_target":"--target universal-apple-darwin","bundle_dir":"apps/desktop/src-tauri/target/universal-apple-darwin/debug/bundle"}'
          present=()
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ "${!name}" = true ]; then present+=("$name"); else missing+=("$name"); fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "::notice title=No Mac installer in this run::The release environment holds no Apple signing secrets yet, so this run builds and publishes nothing for the Mac. The Mac installer is published only signed by SIQstack LLC and notarized by Apple."
            echo "matrix={\"include\":[$windows]}" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Apple signing is partly configured::The release environment is missing ${missing[*]}. Nothing is built until every Apple signing secret is set, or none is."
            exit 1
          else
            echo "matrix={\"include\":[$windows,$macos]}" >> "$GITHUB_OUTPUT"
          fi

  installers:
    needs: legs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Two architectures and Apple's notary service make the macOS leg the
    # long one.
    timeout-minutes: 90
    # The `release` environment holds the SIQstack LLC signing identities and
    # admits only `main` and `unsigned-test/*`, so no other branch can sign.
    # Azure sign-in goes through GitHub's OpenID Connect: no password is
    # stored. The macOS certificate and notary key are environment secrets.
    environment: release
    permissions:
      contents: read
      id-token: write
    # Job-level so the helper build and the bundle build see identical values;
    # `build.rs` reruns on any change to these, and a mismatch between the two
    # steps would recompile the whole crate. These are the same public
    # repository variables the release workflow bakes in, so the test build
    # talks to the real API instead of localhost.
    env:
      SIQSHIFT_AUTH_URL: ${{ vars.SIQSHIFT_AUTH_URL }}
      SIQSHIFT_API_URL: ${{ vars.SIQSHIFT_API_URL }}
      SIQSHIFT_CHROME_EXTENSION_ID: ${{ vars.SIQSHIFT_CHROME_EXTENSION_ID }}
      SIQSHIFT_EDGE_EXTENSION_ID: ${{ vars.SIQSHIFT_EDGE_EXTENSION_ID }}
      SIQSHIFT_FIREFOX_EXTENSION_ID: ${{ vars.SIQSHIFT_FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: unsigned-test
      - run: pnpm install --frozen-lockfile

      # One cargo invocation, not one per helper. A debug build's `build.rs`
      # writes empty `binaries/` stand-ins, and tauri-build copies every
      # sidecar over `target/debug/<name>.exe`. A second invocation reruns the
      # build script and overwrites the helper the first one linked with the
      # empty stand-in, which staging below would then ship.
      - name: Build the helpers
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml ${{ matrix.cargo_targets }} --bin siqshift-hook --bin siqshift-browser-host

      # `externalBin` resolves `binaries/<name>-<target-triple>`, so the helpers
      # have to sit there under that name before the bundler runs. Same staging
      # rule as the release workflow; the bundler signs these copies. A universal
      # macOS build compiles each architecture against its own triple's copy and
      # bundles the `universal-apple-darwin` one, which lipo joins from the two.
      - name: Stage the helpers for bundling
        shell: bash
        run: |
          set -euo pipefail
          binaries=apps/desktop/src-tauri/binaries
          mkdir -p "$binaries"
          stage() {
            cp "$1" "$2"
            if [ ! -s "$2" ]; then
              echo "$2 is empty: the helper build left a debug stand-in, not $(basename "$1")." >&2
              exit 1
            fi
          }
          for name in siqshift-hook siqshift-browser-host; do
            if [ "${{ matrix.target }}" = windows ]; then
              triple="$(rustc -vV | sed -n 's/^host: //p')"
              stage "apps/desktop/src-tauri/target/debug/$name.exe" "$binaries/$name-$triple.exe"
            else
              for triple in aarch64-apple-darwin x86_64-apple-darwin; do
                stage "apps/desktop/src-tauri/target/$triple/debug/$name" "$binaries/$name-$triple"
              done
              lipo -create -output "$binaries/$name-universal-apple-darwin" \
                "$binaries/$name-aarch64-apple-darwin" "$binaries/$name-x86_64-apple-darwin"
            fi
          done

      # The updater only offers a build whose semver is strictly higher than
      # the installed one, so every run needs its own version. `run_number`
      # only ever increases, and numeric prerelease identifiers compare
      # numerically, so `-test.9` correctly precedes `-test.10`. A test build
      # also loses to the eventual signed release, which is what we want.
      - name: Stamp this run's version
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = `${config.version}-test.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
            console.log(`stamped ${config.version}`);
          '

      # --debug is what keeps this build outside the production signing gate.
      # Still no TAURI_CONFIG override, so `bundle.createUpdaterArtifacts`
      # stays off and `build.rs` keeps refusing updater artifacts from a
      # debug build. The updater signature is produced separately below,
      # from the finished installer, so this gate is never touched.
      #
      # Compiling and bundling are separate steps because GitHub's sign-in
      # token for Azure lasts about five minutes: the Azure login has to come
      # after the long compile and right before the bundler starts signing.
      - name: Build the app
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --no-bundle ${{ matrix.tauri_target }}

      # Microsoft's Artifact Signing client is a dlib that signtool loads. It is
      # pinned by version and hash, and it signs in through the Azure CLI
      # session the login step below leaves behind, so every other credential
      # source is excluded. The bundler then calls signtool for the app, both
      # helpers, the uninstaller and the setup.
      - name: Prepare Windows code signing
        id: windows_signing
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
          CLIENT_VERSION: 1.0.128
          CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $ErrorActionPreference = 'Stop'
          $names = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'SIGNING_PUBLISHER'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "The release environment is missing $($missing -join ', '), so the Windows installer cannot be signed."
          }
          $package = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:CLIENT_VERSION/microsoft.artifactsigning.client.$env:CLIENT_VERSION.nupkg" -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash
          if ($hash -ne $env:CLIENT_SHA256) { throw "The Artifact Signing client hashed to $hash, not the pinned $env:CLIENT_SHA256." }
          $client = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          Expand-Archive $package -DestinationPath $client
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { $_.VersionInfo.ProductVersion } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe is not on this runner.' }
          $config = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = $signtool
                  args = @(
                    'sign', '/v', '/fd', 'SHA256',
                    '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                    '/d', 'SIQshift', '/du', 'https://siqshift.siqstack.com',
                    '/dlib', (Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'),
                    '/dmdf', $metadata,
                    '%1'
                  )
                }
              }
            }
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.signing.conf.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content $configPath -Encoding utf8
          "config=$configPath" >> $env:GITHUB_OUTPUT

      # The Developer ID certificate goes into a keychain of this job's own,
      # and the notary key into a file beside it; both live only for this job.
      # The `legs` job runs this leg only when every Apple secret is set.
      - name: Prepare macOS signing
        id: macos_signing
        if: matrix.target == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/siqshift-signing.keychain-db"
          certificate="$RUNNER_TEMP/siqshift-signing.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          if [ "$identity" != "$APPLE_SIGNING_IDENTITY" ] || [[ "$identity" != *"($APPLE_TEAM_ID)" ]]; then
            echo "The certificate in APPLE_CERTIFICATE is not the Developer ID Application identity APPLE_SIGNING_IDENTITY and APPLE_TEAM_ID name." >&2
            exit 1
          fi
          api_key_path="$RUNNER_TEMP/siqshift-notary.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        if: matrix.target == 'windows'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # On macOS the bundler signs the app and both helpers with the hardened
      # runtime, has Apple notarize the app, and staples the ticket to it.
      - name: Bundle the installers
        working-directory: apps/desktop
        shell: bash
        env:
          SIGNING_CONFIG: ${{ steps.windows_signing.outputs.config }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.target == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.target == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ steps.macos_signing.outputs.api_key_path }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_CONFIG" ]; then
            pnpm exec tauri bundle --debug ${{ matrix.bundle_args }} --config "$SIGNING_CONFIG"
          else
            pnpm exec tauri bundle --debug ${{ matrix.bundle_args }} ${{ matrix.tauri_target }}
          fi

      # The disk image people download is signed, notarized and stapled too,
      # so Gatekeeper accepts it before the app inside is ever opened.
      - name: Notarize the macOS disk image
        if: matrix.target == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.macos_signing.outputs.api_key_path }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          images=("$BUNDLE_DIR"/dmg/*.dmg)
          if [ "${#images[@]}" -ne 1 ] || [ ! -f "${images[0]}" ]; then
            echo "Expected one disk image in $BUNDLE_DIR/dmg." >&2
            exit 1
          fi
          image="${images[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$image"
          result="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$image" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$result"
          status="$(node -p 'require(process.argv[1]).status' "$result")"
          if [ "$status" != Accepted ]; then
            echo "Apple's notary service answered $status for the disk image." >&2
            xcrun notarytool log "$(node -p 'require(process.argv[1]).id' "$result")" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" >&2 || true
            exit 1
          fi
          xcrun stapler staple "$image"

      # Nothing is published for the Mac unless what ships is a universal app
      # whose every binary carries SIQstack LLC's Developer ID signature with
      # the hardened runtime, and both the app and the disk image are notarized
      # with the ticket stapled. The app is checked as the disk image delivers it.
      - name: Verify the macOS signatures
        if: matrix.target == 'macos'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          image="$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -print -quit)"
          assessment="$(spctl --assess --type open --context context:primary-signature --verbose=4 "$image" 2>&1)" \
            || fail "Gatekeeper rejects the disk image: $assessment"
          grep -q 'source=Notarized Developer ID' <<< "$assessment" || fail "The disk image is not notarized Developer ID: $assessment"
          xcrun stapler validate "$image"
          mount="$RUNNER_TEMP/siqshift-image"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image" > /dev/null
          trap 'hdiutil detach "$mount" > /dev/null || true' EXIT
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$app" ] || fail "The disk image carries no app."
          codesign --verify --deep --strict --verbose=2 "$app"
          assessment="$(spctl --assess --type execute --verbose=4 "$app" 2>&1)" \
            || fail "Gatekeeper rejects the app: $assessment"
          grep -q 'source=Notarized Developer ID' <<< "$assessment" || fail "The app is not notarized Developer ID: $assessment"
          xcrun stapler validate "$app"
          for helper in siqshift-hook siqshift-browser-host; do
            [ -f "$app/Contents/MacOS/$helper" ] || fail "The app does not carry $helper, so the check would prove nothing."
          done
          for binary in "$app"/Contents/MacOS/*; do
            name="$(basename "$binary")"
            details="$(codesign --display --verbose=2 "$binary" 2>&1)"
            grep -q '^Authority=Developer ID Application: ' <<< "$details" || fail "$name is not signed with a Developer ID Application certificate."
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details" || fail "$name is signed by another team."
            grep -q 'flags=.*(runtime)' <<< "$details" || fail "$name lacks the hardened runtime."
            grep -q '^Timestamp=' <<< "$details" || fail "$name carries no secure timestamp."
            architectures=" $(lipo -archs "$binary") "
            [[ "$architectures" == *' arm64 '* && "$architectures" == *' x86_64 '* ]] || fail "$name is not universal:$architectures"
            echo "verified: $name"
          done

      # Every Windows file that ships must carry a valid, timestamped signature
      # from the expected publisher, checked two ways, or nothing is published.
      # What is checked is the installer and what 7-Zip unpacks from it, not
      # the build tree: the bundler signs a patched copy of the app and leaves
      # `target/debug` holding the unsigned original.
      - name: Verify the Windows signatures
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { $_.VersionInfo.ProductVersion } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/debug/bundle -Recurse -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $payload = Join-Path $env:RUNNER_TEMP 'installer-payload'
          & 7z x $installers[0].FullName "-o$payload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack $($installers[0].Name) (exit code $LASTEXITCODE)." }
          $contents = @(Get-ChildItem $payload -Recurse -File -Include '*.exe', '*.dll')
          $contents | ForEach-Object { Write-Host "payload: $($_.FullName.Substring($payload.Length + 1))" }
          foreach ($helper in 'siqshift-hook.exe', 'siqshift-browser-host.exe') {
            if ($contents.Name -notcontains $helper) { throw "The installer does not carry $helper, so the check would prove nothing." }
          }
          $files = @($installers[0].FullName) + @($contents.FullName)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:SIGNING_PUBLISHER) { throw "$file is signed by '$($signature.SignerCertificate.Subject)', not '$env:SIGNING_PUBLISHER'" }
            if (-not $signature.TimeStamperCertificate) { throw "$file carries no timestamp, so its signature would lapse with the certificate" }
            & $signtool verify /pa /tw $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for $file with exit code $LASTEXITCODE" }
          }

      # The updater verifies a detached minisign signature over the installer
      # bytes. `tauri signer sign` produces exactly what
      # `bundle.createUpdaterArtifacts` would have, without asking the bundler
      # for it, so the production signing gate stays shut. Windows only: the
      # macOS updater wants a `.app.tar.gz`, not the `.dmg` this job builds,
      # so offering a macOS update here would hand the updater something it
      # cannot install.
      - name: Sign the Windows installer for the updater
        if: matrix.target == 'windows'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured; the build would ship an unupdatable installer." >&2
            exit 1
          fi
          installer="$(find src-tauri/target/debug/bundle -type f -name '*-setup.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No NSIS installer to sign" >&2
            find src-tauri/target/debug/bundle -maxdepth 3 >&2 || true
            exit 1
          fi
          pnpm exec tauri signer sign --password "" "$installer"
          test -s "$installer.sig"

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          out=test-artifacts
          bundle="${{ matrix.bundle_dir }}"
          prefix=TEST-
          mkdir -p "$out"
          found=0
          while IFS= read -r -d '' installer; do
            cp "$installer" "$out/$prefix$(basename "$installer")"
            found=1
          done < <(find "$bundle" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          # The updater signature travels beside its installer, under the same
          # renamed prefix, so the publish job can pair them without guessing.
          while IFS= read -r -d '' signature; do
            cp "$signature" "$out/$prefix$(basename "$signature")"
          done < <(find "$bundle" -type f -name '*.sig' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No installer was produced under $bundle" >&2
            find "$bundle" -maxdepth 2 >&2 || true
            exit 1
          fi
          if [ "${{ contains(needs.legs.outputs.matrix, '"target":"macos"') }}" = true ]; then
            mac_bullet="  * This build carries a macOS installer for Apple silicon and
              Intel Macs. It and the app in it are code signed by SIQstack LLC
              and notarized by Apple."
          else
            mac_bullet="  * This build carries no macOS installer, because the Apple
              signing secrets are not set yet. A Mac installer still on the
              release is an earlier, unsigned test build."
          fi
          cat > "$out/TEST-BUILD.txt" <<EOF
          SIQshift test build
          ===================

          These installers are NOT a release. They come from
          ${{ github.repository }} run ${{ github.run_id }}, commit
          ${{ github.sha }}.

          What that means:
            * The Windows installer and everything it installs are code signed
              by SIQstack LLC. SmartScreen may still warn on the first
              downloads, until the certificate has built a reputation.
          $mac_bullet
            * On Windows this build updates itself: it checks for a newer
              build at launch and every six hours, installs it quietly, and
              restarts. A copy installed before the updater shipped cannot,
              because its binary has no updater in it.
            * macOS still updates by hand.
            * It is a debug build, so it is larger and slower than a release
              build.

          This is what siqshift.siqstack.com hands out.
          EOF
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: TEST-BUILD-${{ matrix.target }}-${{ github.run_number }}
          path: test-artifacts/*
          if-no-files-found: error

  publish:
    # A `unsigned-test/**` push is someone exercising a change to this file, so
    # it must not overwrite what the website hands out. Only a deliberate
    # "Run workflow" republishes the public download.
    if: github.event_name == 'workflow_dispatch'
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only place in this workflow that can write to the repository, and it
    # compiles nothing: it renames what `installers` already produced and
    # signed, and uploads it.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: unsigned-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # Fixed names are the whole point: the website links
      # releases/download/unsigned-latest/<these names> as a constant, with no
      # GitHub API lookup and nothing to update when the version changes. The
      # version travels in the release title, the notes, and the app itself.
      - name: Stage the release assets under their permanent names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          take() {
            local pattern="$1" name="$2"
            local found
            found="$(find downloaded -type f -name "$pattern" -print -quit)"
            if [ -z "$found" ]; then
              echo "No artifact matched $pattern" >&2
              find downloaded -type f >&2
              exit 1
            fi
            cp "$found" "release-assets/$name"
          }
          take '*.exe' SIQshift-windows-x64-setup.exe
          # The Mac installer exists only when this run could sign it.
          if [ -n "$(find downloaded -type f -name '*.dmg' -print -quit)" ]; then
            take '*.dmg' SIQshift-macos-universal.dmg
          fi
          take '*.exe.sig' SIQshift-windows-x64-setup.exe.sig
          # Both matrix legs write an identical one, so either will do.
          take 'TEST-BUILD.txt' TEST-BUILD.txt
          ls -l release-assets

      # The manifest the installed app polls. It lives at the same fixed
      # `unsigned-latest` names as the installers, so an installed build's
      # endpoint never has to change and no API lookup is involved.
      #
      # Windows only, deliberately: the macOS updater installs from a
      # `.app.tar.gz`, and this workflow ships a `.dmg`. Listing `darwin` here
      # would advertise an update the updater cannot apply.
      - name: Write the update manifest
        shell: bash
        env:
          BASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/download/unsigned-latest"
          INSTALLER_NAME: SIQshift-windows-x64-setup.exe
          SIGNATURE_PATH: release-assets/SIQshift-windows-x64-setup.exe.sig
          MANIFEST_PATH: release-assets/latest.json
        run: |
          set -euo pipefail
          # This checkout carries the unstamped version, so the same `-test.N`
          # suffix the build stamped is reapplied from the same run number.
          export VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")-test.${{ github.run_number }}"
          node scripts/updater-manifest.mjs

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")-test.${{ github.run_number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ -e release-assets/SIQshift-macos-universal.dmg ]; then
            mac_note="The macOS installer and the app in it are **code signed by SIQstack LLC and notarized by Apple**, for Apple silicon and Intel Macs."
          else
            mac_note="This build has **no macOS installer**: the Mac one is published only signed and notarized, and the Apple signing secrets are not set yet. A Mac file still on this release is an earlier, unsigned test build."
          fi
          cat > release-notes.md <<EOF
          Test build of SIQshift **$version**, from commit
          \`${{ github.sha }}\` (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          The Windows installer, and everything it installs, is **code signed by
          SIQstack LLC**, and Windows names SIQstack LLC as the publisher.
          SmartScreen may still warn on the first downloads while the
          certificate builds a reputation: choose **More info**, then **Run
          anyway**.

          $mac_note

          They are debug builds, so they are larger and slower than a release
          build.

          **Windows updates itself from here.** Once a build carrying the
          updater is installed, SIQshift checks this manifest at launch and
          every six hours, installs a newer build quietly, and restarts into
          it. Nothing to click, and a machine that is offline simply checks
          again later. A copy installed *before* the updater shipped cannot
          update itself, because its binary has no updater in it: install this
          build once by hand and every build after it is automatic. macOS still
          updates by hand, because the updater installs from an app archive
          rather than the `.dmg` this workflow builds.

          This tag and these file names never change. Every run of the *Unsigned
          test installers* workflow replaces the assets in place, so the links
          below always point at the newest build, and so does the **Download for
          Windows** button on siqshift.siqstack.com.
          EOF

      # Force the tag onto this commit so the release stops claiming to be
      # whatever commit first created it.
      - name: Move the unsigned-latest tag to this commit
        run: git push --force origin "HEAD:refs/tags/$TAG"

      # Edit-or-create, never delete-and-recreate: deleting would leave the
      # published download URL 404ing for the length of the upload. An asset
      # this run did not stage is removed only after the upload, so the
      # release ends up carrying exactly this build and nothing stale. The one
      # exception: a run without a signed Mac build publishes nothing for the
      # Mac, so it leaves the release's Mac file as it is. It is never the
      # repository's latest release: the website and release installs read
      # releases/latest, which must always be the newest signed release
      # from `release.yml`, never a test build.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          title="Test build $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md \
              --prerelease=false --latest=false --target "${{ github.sha }}"
          else
            gh release create "$TAG" --title "$title" --notes-file release-notes.md \
              --latest=false --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            if [ ! -e "release-assets/$asset" ] && { [ -e release-assets/SIQshift-macos-universal.dmg ] || [[ "$asset" != *.dmg ]]; }; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
