# Per-repo no-mistakes configuration for SIQshift.
#
# The CFO pipeline driver (cfo pipeline run) requires this file to be readable
# on the default branch and on every gated task branch before a managed gate
# run can start. The primary agent is deliberately omitted so the installed
# global native Codex profile controls ordinary gate roles. Review auto-fix
# remains disabled, with one automatic follow-up each for test, lint, rebase
# and CI.
auto_fix:
  review: 0
  test: 1
  lint: 1
  rebase: 1
  ci: 1
